  <g fill="#252525" font-family="Arial, sans-serif">
    <text x="32" y="33" font-size="18">Divide 7 by 12.</text>
    <text x="355" y="113" font-size="15">7 is less than 12.</text>
    <text x="355" y="134" font-size="15">Start with 0.</text>
    <text x="355" y="213" font-size="15">70 − 60 = 10.</text>
    <text x="355" y="234" font-size="15">Bring down the next 0.</text>
    <text x="355" y="301" font-size="15">100 − 96 = 4.</text>
    <text x="355" y="322" font-size="15">Bring down another 0.</text>
    <text x="355" y="389" font-size="15">40 − 36 = 4.</text>
    <text x="355" y="410" font-size="15">The remainder 4 returns.</text>
    <text x="382" y="469" font-size="15">Only the 3 repeats.</text>
  </g>
