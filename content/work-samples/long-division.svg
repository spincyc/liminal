  <title>Long division: 7 divided by 12</title>
  <desc>Long division of 7 by 12. The quotient begins 0.583… . Subtract 60 from 70 to get 10; bring down 0 to make 100. Subtract 96 to get 4; bring down 0 to make 40. Subtract 36 to get 4 again. The remainder 4 repeats, so 7 divided by 12 equals 0.58333…; the exact decimal has a bar over only the 3.</desc>
